<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>場勘</title>
<meta name="theme-color" content="#14171A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="場勘">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-192.png">
<style>
:root {
  --bg: #F4F3EF; --card: #FFFFFF; --fg: #14171A; --muted: #5E6670; --line: #DCDAD3;
  --accent: #FFD23F; --accent-ink: #14171A; --ok: #2E7D4F; --warn: #B4400F; --rec: #D92D20; --chip: #E9E7E0;
  --bar: #14171A; --bar-fg: #F4F3EF; --chip-off: #2A2F35; --focus: #14171A;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #101214; --card: #1A1D21; --fg: #EDEBE6; --muted: #9AA3AD; --line: #2C3036;
    --accent: #FFD23F; --accent-ink: #14171A; --ok: #6FCF97; --warn: #F2994A; --rec: #FF5A4E; --chip: #24282D;
    --bar: #000000; --bar-fg: #EDEBE6; --chip-off: #2A2F35; --focus: #FFD23F;
    color-scheme: dark;
  }
}
/* 夜間紅光：夜觀、清晨摸黑用 */
html.night {
  --bg: #000; --card: #0B0000; --fg: #E0281C; --muted: #8E1A12; --line: #3A0B07;
  --accent: #8E1A12; --accent-ink: #000; --ok: #E0281C; --warn: #E0281C; --rec: #E0281C; --chip: #1A0302;
  --bar: #000; --bar-fg: #E0281C; --chip-off: #1A0302; --focus: #E0281C; color-scheme: dark;
}
html.night img, html.night video { filter: grayscale(1) sepia(1) hue-rotate(-50deg) saturate(4) brightness(.55) }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent }
[hidden] { display: none !important }
html, body { margin: 0; background: var(--bg); color: var(--fg) }
body { font: 16px/1.5 -apple-system, BlinkMacSystemFont, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif; min-height: 100vh; min-height: 100dvh; overscroll-behavior-y: none }
button { font: inherit; color: inherit }
button:disabled { opacity: .4 }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px }

.top { position: sticky; top: 0; z-index: 10; background: var(--bar); color: var(--bar-fg); padding-top: env(safe-area-inset-top) }
.top-row { display: flex; align-items: center; gap: 4px; padding: 6px 8px 2px calc(12px + env(safe-area-inset-left)) }
.top-row .proj { flex: 1; min-width: 0; font-weight: 700; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis }
.top-row .proj small { font-weight: 400; opacity: .7; margin-right: 6px }
.icon-btn { flex: none; min-width: 44px; height: 44px; border: 0; border-radius: 10px; background: transparent; color: inherit; font-size: 22px; line-height: 1; cursor: pointer; position: relative }
.icon-btn .badge { position: absolute; top: 8px; right: 6px; width: 9px; height: 9px; border-radius: 50%; background: var(--accent) }
.chips { display: flex; gap: 6px; overflow-x: auto; padding: 4px 12px 10px; scrollbar-width: none }
.chips::-webkit-scrollbar { display: none }
.chip { flex: none; border: 0; border-radius: 999px; padding: 8px 14px; min-height: 40px; background: var(--chip-off); color: var(--bar-fg); font-size: 15px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px }
.chip[aria-current="true"] { background: var(--accent); color: var(--accent-ink); font-weight: 700 }
.chip .dot { width: 7px; height: 7px; border-radius: 50%; border: 1.5px solid currentColor; opacity: .7 }
.chip .dot.full { background: #6FCF97; border-color: #6FCF97; opacity: 1 }
.chip .dot.here { background: currentColor; opacity: 1 }
.recbar, .unsaved { display: flex; align-items: center; gap: 8px; padding: 6px calc(12px + env(safe-area-inset-right)) 6px calc(12px + env(safe-area-inset-left)); font-size: 14px }
.recbar { background: var(--rec); color: #fff }
.recbar .rdot { width: 10px; height: 10px; border-radius: 50%; background: #fff; animation: blink 1s infinite }
@keyframes blink { 50% { opacity: .2 } }
@media (prefers-reduced-motion: reduce) { .recbar .rdot { animation: none } }
.recbar .what { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis }
.recbar button, .unsaved button { border: 1.5px solid currentColor; background: transparent; border-radius: 8px; padding: 4px 12px; min-height: 36px; cursor: pointer; flex: none }
.unsaved { background: var(--accent); color: var(--accent-ink); flex-wrap: wrap }
.unsaved span { flex: 1 1 100% }

main { padding: 14px 14px calc(110px + env(safe-area-inset-bottom)); max-width: 720px; margin: 0 auto }
h1 { font-size: 22px; line-height: 1.3; margin: 2px 0 6px }
.when { display: grid; gap: 2px; font-size: 14px; color: var(--muted); margin-bottom: 10px }
.when b { color: var(--fg); font-weight: 600; margin-right: 4px }
.note-box { font-size: 14px; color: var(--muted); border-left: 3px solid var(--accent); padding: 2px 0 2px 10px; margin: 0 0 12px }

.visit { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 0 0 14px }
.vbtn { border: 1.5px solid var(--line); background: var(--card); border-radius: 12px; padding: 8px 10px; min-height: 58px; text-align: left; cursor: pointer; display: grid }
.vbtn .k { font-size: 13px; color: var(--muted) }
.vbtn .v { font-size: 18px; font-weight: 700; font-variant-numeric: tabular-nums }
.vbtn .g { font-size: 12px; color: var(--muted) }
.vbtn.set { border-color: var(--fg) }
.visit-sum { grid-column: 1 / -1; font-size: 13px; color: var(--muted) }

.card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; margin-bottom: 12px }
.item { padding: 10px 12px; border-top: 1px solid var(--line) }
.item:first-child { border-top: 0 }
.row { display: grid; grid-template-columns: 34px 1fr; gap: 8px; align-items: start }
.row input[type=checkbox] { width: 28px; height: 28px; margin: 2px 0 0; accent-color: var(--fg); cursor: pointer }
.row label { cursor: pointer; min-width: 0; padding-top: 2px }
.txt { font-size: 16px }
.hint { display: block; font-size: 13px; color: var(--muted); margin-top: 2px }
.must { display: inline-block; font-size: 11px; font-weight: 700; background: var(--accent); color: var(--accent-ink); border-radius: 4px; padding: 0 5px; margin-right: 6px; vertical-align: 2px }
.item.done .txt { color: var(--muted); text-decoration: line-through }
.acts { display: flex; gap: 6px; margin: 6px 0 0 42px }
.act { height: 38px; min-width: 52px; border: 1px solid var(--line); border-radius: 19px; background: transparent; font-size: 14px; padding: 0 12px; cursor: pointer; color: var(--fg); position: relative }
.act.has::after { content: ""; position: absolute; top: 4px; right: 6px; width: 7px; height: 7px; border-radius: 50%; background: var(--warn) }
.act.on { background: var(--rec); border-color: var(--rec); color: #fff }
.sub-wrap { margin: 8px 0 0 42px }
.sub-wrap.flush { margin-left: 0 }
textarea { width: 100%; font: inherit; font-size: 16px; color: var(--fg); background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 8px; resize: vertical; min-height: 64px }
.media { display: flex; gap: 6px; flex-wrap: wrap; margin: 8px 0 0 42px }
.media.flush { margin-left: 0 }
.media button { padding: 0; border: 0; border-radius: 8px; overflow: hidden; width: 64px; height: 64px; background: var(--chip); cursor: pointer; font-size: 12px; color: var(--fg) }
.media img { width: 100%; height: 100%; object-fit: cover; display: block }
.media .aud { display: grid; place-content: center; text-align: center; line-height: 1.3 }
.media .aud b { font-size: 18px }

details.more { margin-bottom: 12px }
details.more > summary { list-style: none; cursor: pointer; padding: 12px 4px; color: var(--muted); font-size: 15px; min-height: 44px }
details.more > summary::-webkit-details-marker { display: none }
details.more > summary::before { content: "▸ " }
details.more[open] > summary::before { content: "▾ " }
.sec-label { font-size: 13px; color: var(--muted); margin: 18px 4px 6px; font-weight: 600 }
.add-row { display: flex; gap: 8px; margin-bottom: 12px }
.add-row input { flex: 1; min-width: 0; font: inherit; font-size: 16px; padding: 10px; border: 1px solid var(--line); border-radius: 10px; background: var(--card); color: var(--fg) }
.btn { border: 1.5px solid var(--fg); background: transparent; border-radius: 10px; padding: 8px 14px; min-height: 44px; cursor: pointer; font-size: 15px }
.btn.primary { background: var(--fg); color: var(--bg) }
.btn.wide { width: 100% }
.st-tools { display: grid; grid-template-columns: 1fr; gap: 8px; margin-bottom: 8px }

.foot { position: fixed; left: 0; right: 0; bottom: 0; z-index: 10; background: var(--bg); border-top: 1px solid var(--line); padding: 10px 12px calc(10px + env(safe-area-inset-bottom)); display: grid; grid-template-columns: 50px 60px 60px 1fr; gap: 8px }
.foot .btn { min-height: 52px; font-size: 16px; padding: 0 6px }
.foot .big { font-size: 22px }
.foot .big.on { background: var(--rec); border-color: var(--rec); color: #fff }
.foot .next { background: var(--fg); color: var(--bg); white-space: nowrap; overflow: hidden; text-overflow: ellipsis }

dialog { border: 0; padding: 0; background: var(--card); color: var(--fg); width: min(560px, 100vw); max-width: 100vw; max-height: 92dvh; border-radius: 16px 16px 0 0; margin: auto auto 0 }
dialog::backdrop { background: rgba(0,0,0,.5) }
.sheet { padding: 16px 16px calc(16px + env(safe-area-inset-bottom)); display: grid; gap: 10px }
.sheet h2 { font-size: 18px; margin: 0 }
.sheet .sub { font-size: 13px; color: var(--muted); margin: -4px 0 0 }
.sheet ul { margin: 0; padding-left: 20px; font-size: 14px }
.sheet .facts { display: grid; gap: 4px; font-size: 14px }
.sheet hr { border: 0; border-top: 1px solid var(--line); margin: 4px 0 }
.muted { font-size: 13px; color: var(--muted) }
.viewer img { width: 100%; max-height: 60dvh; object-fit: contain; background: #000; border-radius: 10px; display: block }
.viewer audio { width: 100% }
.meta { font-size: 14px; display: grid; gap: 2px }
.meta a { color: inherit }
.btn-row { display: flex; gap: 8px; flex-wrap: wrap }
.btn-row .btn { flex: 1 }
.danger { border-color: var(--warn); color: var(--warn) }

/* 指南針 */
.dial-wrap { display: grid; place-items: center; padding: 6px 0 }
.dial { width: min(260px, 70vw); height: auto; display: block }
.hdg-big { text-align: center; font-size: 34px; font-weight: 800; font-variant-numeric: tabular-nums; line-height: 1.1 }
.hdg-sub { text-align: center; font-size: 13px; color: var(--muted) }
.marks-list { font-size: 14px; display: grid; gap: 2px }

/* 內建相機 */
.cam { position: fixed; inset: 0; z-index: 100; background: #000; color: #fff; display: flex; flex-direction: column; padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left) }
.cam button { color: #fff }
.cam-top { display: flex; align-items: center; gap: 8px; padding: 6px 10px; flex: none }
.cam-top .hdg { flex: 1; text-align: center; font-weight: 700; font-variant-numeric: tabular-nums; font-size: 16px }
.cam-pill { border: 1.5px solid rgba(255,255,255,.7); background: rgba(0,0,0,.4); border-radius: 999px; padding: 6px 14px; min-height: 40px; cursor: pointer; font-size: 15px }
.cam-pill.y { background: #FFD23F; color: #14171A !important; border-color: #FFD23F; font-weight: 700 }
.cam-view { position: relative; flex: 1; overflow: hidden; min-height: 0 }
.cam-view video { position: absolute; background: #111 }
.cam-frame { position: absolute; border: 2px solid #FFD23F; box-shadow: 0 0 0 200vmax rgba(0,0,0,.6); pointer-events: none }
.cam-frame .lab { position: absolute; left: 0; bottom: -26px; font-size: 13px; color: #FFD23F; white-space: nowrap; font-weight: 600 }
.cam-frame .third { position: absolute; inset: 0; background:
  linear-gradient(to right, transparent calc(33.33% - .5px), rgba(255,255,255,.25) calc(33.33% - .5px), rgba(255,255,255,.25) calc(33.33% + .5px), transparent calc(33.33% + .5px), transparent calc(66.66% - .5px), rgba(255,255,255,.25) calc(66.66% - .5px), rgba(255,255,255,.25) calc(66.66% + .5px), transparent calc(66.66% + .5px)),
  linear-gradient(to bottom, transparent calc(33.33% - .5px), rgba(255,255,255,.25) calc(33.33% - .5px), rgba(255,255,255,.25) calc(33.33% + .5px), transparent calc(33.33% + .5px), transparent calc(66.66% - .5px), rgba(255,255,255,.25) calc(66.66% - .5px), rgba(255,255,255,.25) calc(66.66% + .5px), transparent calc(66.66% + .5px)) }
.sunmark { position: absolute; top: 0; bottom: 0; width: 0; border-left: 2px dashed #FFD23F }
.sunmark span { position: absolute; left: 4px; font-size: 12px; background: rgba(0,0,0,.6); color: #FFD23F; padding: 1px 5px; border-radius: 4px; white-space: nowrap }
.sundot { position: absolute; width: 8px; height: 8px; margin: -4px 0 0 -4px; border-radius: 50%; background: #FFD23F; opacity: .75 }
.sundot.hr { width: 11px; height: 11px; margin: -5.5px 0 0 -5.5px; opacity: 1 }
.sundot.sel { width: 26px; height: 26px; margin: -13px 0 0 -13px; background: radial-gradient(#FFF6C2, #FFD23F 60%, rgba(255,210,63,.2)); opacity: 1; box-shadow: 0 0 12px #FFD23F }
.sundot span { position: absolute; left: 14px; top: -6px; font-size: 12px; color: #FFD23F; text-shadow: 0 0 3px #000; white-space: nowrap }
.cam-msg { position: absolute; left: 16px; right: 16px; top: 40%; text-align: center; font-size: 15px; background: rgba(0,0,0,.7); padding: 12px; border-radius: 10px }
.cam-flash { position: absolute; inset: 0; background: #fff; opacity: 0; pointer-events: none; transition: opacity .25s }
.cam-flash.on { opacity: .7; transition: none }
.cam-sun { font-size: 13px; padding: 4px 12px; min-height: 22px; text-align: center; color: #FFD23F; flex: none }
.cam-focals { display: flex; gap: 6px; overflow-x: auto; padding: 4px 10px; scrollbar-width: none; flex: none }
.cam-focals::-webkit-scrollbar { display: none }
.cam-focals button { flex: none; border: 0; border-radius: 999px; background: rgba(255,255,255,.14); min-width: 52px; height: 40px; font-size: 15px; font-variant-numeric: tabular-nums; cursor: pointer }
.cam-focals button[aria-pressed="true"] { background: #FFD23F; color: #14171A; font-weight: 700 }
.cam-bottom { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 10px; padding: 8px 12px 10px; flex: none }
.cam-bottom .l { justify-self: start } .cam-bottom .r { justify-self: end }
.shutter { width: 74px; height: 74px; border-radius: 50%; border: 5px solid #fff; background: #fff; box-shadow: inset 0 0 0 4px #000; cursor: pointer }
.shutter:active { background: #ddd }
.cam-target { font-size: 12px; color: rgba(255,255,255,.7); text-align: center; padding: 0 12px 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: none }
.cam-set { position: absolute; inset: auto 0 0 0; z-index: 2; background: #1A1D21; color: #EDEBE6; border-radius: 16px 16px 0 0; padding: 14px 14px calc(14px + env(safe-area-inset-bottom)); display: grid; gap: 10px; max-height: 80%; overflow: auto }
.cam-set h3 { margin: 0; font-size: 16px }
.cam-set .opts { display: flex; gap: 6px; flex-wrap: wrap }
.cam-set .opts button { border: 1.5px solid #555; background: transparent; border-radius: 10px; padding: 6px 12px; min-height: 40px; cursor: pointer; font-size: 14px }
.cam-set .opts button[aria-pressed="true"] { border-color: #FFD23F; color: #FFD23F; font-weight: 700 }
.cam-set .note { font-size: 12px; color: #9AA3AD }
.cam-set input[type=range] { width: 100% }
.cam-warn { position: absolute; left: 10px; right: 10px; top: 8px; z-index: 1; background: #B42318; color: #fff; font-size: 14px; font-weight: 600; padding: 8px 10px; border-radius: 8px; text-align: center }
#cam-marks.unsure { opacity: .45 }
.cam-calib { position: absolute; right: 10px; top: 8px; z-index: 1; font-size: 13px; min-height: 36px; padding: 4px 10px }
/* 主畫面橫拿時避開瀏海、圓角 */
.top-row { padding-right: calc(8px + env(safe-area-inset-right)) }
.chips { padding-left: calc(12px + env(safe-area-inset-left)); padding-right: calc(12px + env(safe-area-inset-right)) }
main { padding-left: max(14px, env(safe-area-inset-left)); padding-right: max(14px, env(safe-area-inset-right)) }
.foot { padding-left: calc(12px + env(safe-area-inset-left)); padding-right: calc(12px + env(safe-area-inset-right)) }
.sheet { padding-left: max(16px, env(safe-area-inset-left)); padding-right: max(16px, env(safe-area-inset-right)) }
/* 橫拿：取景放左邊、按鈕放右邊一欄 */
@media (orientation: landscape) and (max-height: 560px) {
  .cam { display: grid; grid-template-columns: minmax(0, 1fr) 236px; grid-template-rows: auto auto auto auto minmax(0, 1fr) auto; align-items: start; overflow-y: auto }
  .cam > * { grid-column: 2; min-width: 0 }
  .cam > .cam-view { grid-column: 1; grid-row: 1 / -1; height: 100%; align-self: stretch }
  .cam-top { flex-wrap: wrap; padding: 6px 8px 2px }
  .cam-top .hdg { order: -1; flex-basis: 100%; font-size: 15px }
  .cam-top .cam-pill { flex: 1 }
  .cam-sun { font-size: 12px; line-height: 1.35; padding: 2px 8px; text-align: left; min-height: 0; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden }
  .cam-focals { padding: 4px 8px }
  .cam-focals button { height: 36px }
  .cam-bottom { grid-template-columns: 1fr 1fr; gap: 6px; padding: 4px 8px; align-self: end }
  .cam-bottom .shutter { grid-column: 1 / -1; grid-row: 1; justify-self: center; width: 60px; height: 60px; border-width: 4px }
  .cam-bottom .cam-pill { min-height: 34px }
  .cam-bottom .cam-pill { font-size: 13px; padding: 4px 8px; justify-self: stretch }
  .cam-target { padding: 0 8px 4px }
}
html.night .cam, html.night .cam button, html.night .cam-sun, html.night .cam-set { color: #FF6B5B !important }
html.night .cam-frame { border-color: #C0392B }
html.night .cam-frame .lab, html.night .sundot span, html.night .sunmark span { color: #FF6B5B }
html.night .sundot, html.night .cam-pill.y, html.night .cam-focals button[aria-pressed="true"] { background: #8E1B12 !important; border-color: #8E1B12; color: #FFB3A8 !important }
html.night .sunmark { border-left-color: #C0392B }
html.night .cam-flash { background: #400 }
html.night .sundot.sel { background: #8E1B12 !important; box-shadow: 0 0 10px #5A0E08 }
html.night .cam-warn { background: #5A0E08; color: #FFB3A8 !important }
html.night .shutter { background: #5A0E08; border-color: #8E1B12; box-shadow: inset 0 0 0 4px #000 }

.toast { position: fixed; left: 50%; bottom: calc(88px + env(safe-area-inset-bottom)); transform: translateX(-50%); background: var(--fg); color: var(--bg); padding: 10px 16px; border-radius: 10px; font-size: 14px; z-index: 200; max-width: calc(100vw - 32px); opacity: 0; transition: opacity .2s; pointer-events: none }
.toast.on { opacity: 1 }
@media (prefers-reduced-motion: reduce) { .toast, .cam-flash { transition: none } }

.welcome { padding: calc(28px + env(safe-area-inset-top)) 18px 40px; max-width: 560px; margin: 0 auto; display: grid; gap: 14px }
.welcome h1 { font-size: 28px }
.welcome ol { padding-left: 20px; margin: 0; color: var(--muted) }
.welcome textarea { min-height: 120px; font-size: 13px; font-family: ui-monospace, Menlo, monospace }
</style>
</head>
<body>

<div id="welcome" class="welcome" hidden>
  <h1>場勘</h1>
  <p>一站一頁的場勘工具。勾選、筆記、照片、錄音、到站時間和位置都存在這支手機裡，沒有訊號也能用。</p>
  <ol>
    <li>在 Safari 按分享 →「加入主畫面」，之後都從主畫面打開</li>
    <li>從主畫面打開後，匯入專案檔（.json）</li>
  </ol>
  <button class="btn primary wide" id="w-import" type="button">匯入專案檔</button>
  <details>
    <summary class="muted">或貼上專案檔內容</summary>
    <textarea id="w-paste" placeholder="把 .json 的內容貼在這裡"></textarea>
    <button class="btn wide" id="w-paste-go" type="button" style="margin-top:8px">用貼上的內容建立專案</button>
  </details>
  <p class="muted" id="w-ver"></p>
</div>

<div id="app" hidden>
  <header class="top">
    <div class="top-row">
      <div class="proj" id="proj"></div>
      <button class="icon-btn" id="b-compass" type="button" aria-label="指南針">🧭</button>
      <button class="icon-btn" id="b-menu" type="button" aria-label="選單">⋯<span class="badge" id="menu-badge" hidden></span></button>
    </div>
    <div class="recbar" id="recbar" hidden><span class="rdot"></span><b id="rec-time">0:00</b><span class="what" id="rec-what"></span><button id="rec-stop" type="button">停止</button></div>
    <div class="unsaved" id="unsaved" hidden><span id="unsaved-msg"></span><button id="uns-retry" type="button">再試一次</button><button id="uns-share" type="button">存到相簿／檔案</button></div>
    <nav class="chips" id="chips" aria-label="站別"></nav>
  </header>
  <main id="main"></main>
  <div class="foot">

<script>
"use strict";
const APP_VERSION = "1.2.2";
const TZ = "Asia/Taipei";
const MAX_EDGE = 2560, THUMB_EDGE = 320, PART_BYTES = 100e6, GPS_TIMEOUT = 45000;

/* ================= IndexedDB（斷線會自動重連再試一次） ================= */
let idb = null;
function openDB() {
  return new Promise((resolve, reject) => {
    const r = indexedDB.open("scout-tool", 1);
    r.onupgradeneeded = () => {
      const d = r.result;
      if (!d.objectStoreNames.contains("projects")) d.createObjectStore("projects", { keyPath: "id" });
      if (!d.objectStoreNames.contains("logs")) d.createObjectStore("logs", { keyPath: "projectId" });
      if (!d.objectStoreNames.contains("photos")) d.createObjectStore("photos", { keyPath: "id" }).createIndex("project", "projectId");
      if (!d.objectStoreNames.contains("blobs")) d.createObjectStore("blobs");
    };
    r.onsuccess = () => { const d = r.result; d.onclose = () => { if (idb === d) idb = null }; d.onversionchange = () => { d.close(); if (idb === d) idb = null }; resolve(d) };
    r.onerror = () => reject(r.error);
    r.onblocked = () => reject(new Error("blocked"));
  });
}
function txOnce(stores, mode, fn) {
  return new Promise((resolve, reject) => {
    let t;
    try { t = idb.transaction(stores, mode) } catch (e) { reject(e); return }
    let out;
    try { out = fn(t) } catch (e) { try { t.abort() } catch (_) {} reject(e); return }
    t.oncomplete = () => resolve(out && typeof out === "object" && "result" in out ? out.result : out);
    t.onerror = () => reject(t.error);
    t.onabort = () => reject(t.error || new Error("abort"));
    if (mode === "readwrite" && typeof t.commit === "function") { try { t.commit() } catch (_) {} }
  });
}
const isConnErr = e => !!e && (e.name === "UnknownError" || e.name === "InvalidStateError" || /lost|clos/i.test(e.message || ""));
async function run(stores, mode, fn) {
  for (let attempt = 0; ; attempt++) {
    try {
      if (!idb) idb = await openDB();
      return await txOnce(stores, mode, fn);
    } catch (e) {
      if (attempt === 0 && isConnErr(e)) { try { idb && idb.close() } catch (_) {} idb = null; continue }

    }

}
const dbGet = (s, k) => run([s], "readonly", t => t.objectStore(s).get(k));
const dbAll = s => run([s], "readonly", t => t.objectStore(s).getAll());
const dbPut = (s, v, k) => run([s], "readwrite", t => { k === undefined ? t.objectStore(s).put(v) : t.objectStore(s).put(v, k) });

/* ================= 狀態 ================= */
let projects = [], project = null, log = null, media = [];
let idx = 0, openNotes = {}, pendingSys = null, unsaved = [];
let compassWanted = false, compassOn = false, heading = null, lastActivity = Date.now();
const thumbURLs = new Map();

function uiKey() { return "scout-ui:" + project.id }
function readUI() { try { return JSON.parse(localStorage.getItem(uiKey()) || "{}") } catch (e) { return {} } }
function writeUI(u) { try { localStorage.setItem(uiKey(), JSON.stringify(u)) } catch (e) {} }
function lsGet(k) { try { return localStorage.getItem(k) } catch (e) { return null } }
function lsSet(k, v) { try { localStorage.setItem(k, v) } catch (e) {} }
function emptyLog(pid) { return { projectId: pid, items: {}, visits: {}, custom: {}, stationNotes: {}, lastExport: 0, updatedAt: 0 } }
const photos = () => media.filter(m => m.kind !== "audio");
const audios = () => media.filter(m => m.kind === "audio");

/* ---- 紀錄寫入：排隊寫進 IndexedDB；失敗會自動重試 ---- */
let saving = Promise.resolve(), saveTimer = null, retryTimer = null, dirty = false, saveFailNotified = false;
function saveLog(now) { dirty = true; clearTimeout(saveTimer); if (now) flushLog(); else saveTimer = setTimeout(flushLog, 400) }
function flushLog() {
  clearTimeout(saveTimer);
  if (!dirty || !log) return saving;
  dirty = false;
  log.updatedAt = Date.now();
  const snapshot = JSON.parse(JSON.stringify(log));
  saving = saving.then(() => dbPut("logs", snapshot)).then(() => { saveFailNotified = false }).catch(e => {
    dirty = true;
    if (!saveFailNotified) { saveFailNotified = true; toast("存檔失敗，會自動再試：" + (e && e.message || e), 4000) }
    clearTimeout(retryTimer); retryTimer = setTimeout(flushLog, 3000);
  });
  return saving;
}

/* ================= 小工具 ================= */
const $ = id => document.getElementById(id);
function el(tag, attrs, ...kids) {

  if (attrs) for (const [k, v] of Object.entries(attrs)) {
    if (v == null || v === false) continue;
    if (k === "class") n.className = v;
    else if (k === "text") n.textContent = v;
    else if (k.startsWith("on")) n.addEventListener(k.slice(2), v);
    else n.setAttribute(k, v === true ? "" : v);
  }
  for (const c of kids.flat()) if (c != null && c !== false) n.append(c);
  return n;
}
let toastTimer = null;
function toast(msg, ms) { const t = $("toast"); t.textContent = msg; t.classList.add("on"); clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove("on"), ms || 2600) }
const fmtTime = ms => new Date(ms).toLocaleTimeString("zh-TW", { timeZone: TZ, hour: "2-digit", minute: "2-digit", hour12: false });
const fmtDateTime = ms => new Date(ms).toLocaleString("zh-TW", { timeZone: TZ, month: "numeric", day: "numeric", hour: "2-digit", minute: "2-digit", hour12: false });
function fmtDur(ms) { if (!(ms >= 0)) return ""; const m = Math.round(ms / 60000); return m < 60 ? m + " 分" : Math.floor(m / 60) + " 小時 " + (m % 60) + " 分" }
const fmtSec = ms => { const s = Math.round(ms / 1000); return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0") };
const norm = d => ((d % 360) + 360) % 360;
const delta = (a, b) => ((a - b + 540) % 360) - 180;   // a 在 b 的右邊為正
function dirName(deg) { const n = ["北", "北北東", "東北", "東北東", "東", "東南東", "東南", "南南東", "南", "南南西", "西南", "西南西", "西", "西北西", "西北", "北北西"]; return n[Math.round(norm(deg) / 22.5) % 16] }
const mapURL = g => "https://maps.google.com/?q=" + g.lat + "," + g.lon;
function stamp(ms) {
  const p = Object.fromEntries(new Intl.DateTimeFormat("en-CA", { timeZone: TZ, year: "numeric", month: "2-digit", day: "2-digit", hour: "2-digit", minute: "2-digit", second: "2-digit", hour12: false }).formatToParts(new Date(ms)).map(x => [x.type, x.value]));
  const h = p.hour === "24" ? "00" : p.hour;
  return { date: p.year + p.month + p.day, time: h + p.minute + p.second, hm: h + p.minute };
}
function uid(prefix) { return prefix + Date.now().toString(36) + Math.random().toString(36).slice(2, 6) }
const withTimeout = (p, ms) => Promise.race([p, new Promise((_, rej) => setTimeout(() => rej(new Error("timeout")), ms))]);

/* ================= 太陽位置（NOAA 簡化公式，誤差約 1°） ================= */
function sunPos(ms, lat, lon) {
  const rad = Math.PI / 180, d = ms / 86400000 + 2440587.5 - 2451545.0;
  const g = (357.529 + 0.98560028 * d) * rad, q = 280.459 + 0.98564736 * d;
  const L = (q + 1.915 * Math.sin(g) + 0.020 * Math.sin(2 * g)) * rad, e = (23.439 - 0.00000036 * d) * rad;
  const ra = Math.atan2(Math.cos(e) * Math.sin(L), Math.cos(L)), dec = Math.asin(Math.sin(e) * Math.sin(L));
  const gmst = ((18.697374558 + 24.06570982441908 * d) % 24 + 24) % 24;
  const ha = (gmst * 15 + lon) * rad - ra, la = lat * rad;
  const alt = Math.asin(Math.sin(la) * Math.sin(dec) + Math.cos(la) * Math.cos(dec) * Math.cos(ha));
  const az = Math.atan2(-Math.sin(ha), Math.tan(dec) * Math.cos(la) - Math.sin(la) * Math.cos(ha));
  return { az: norm(az / rad), alt: alt / rad };
}
/* ---- 一整天的太陽：日出日落、金色時刻、每 5 分鐘的位置（時間一律台北） ---- */
const tpeMs = (date, min) => Date.parse(date + "T00:00:00+08:00") + min * 60000;
const fmtMin = m => { if (m == null) return "—"; m = Math.round(m); return String(Math.floor(m / 60) % 24).padStart(2, "0") + ":" + String(m % 60).padStart(2, "0") };
function todayTPE() { const s = stamp(Date.now()).date; return s.slice(0, 4) + "-" + s.slice(4, 6) + "-" + s.slice(6, 8) }
function nowMinTPE() { const s = stamp(Date.now()).time; return +s.slice(0, 2) * 60 + +s.slice(2, 4) }
const dayCache = new Map();
function sunDay(date, lat, lon) {
  const key = date + "|" + lat.toFixed(3) + "|" + lon.toFixed(3);
  if (dayCache.has(key)) return dayCache.get(key);
  const pts = [];
  for (let m = 0; m <= 1440; m += 5) { const p = sunPos(tpeMs(date, m), lat, lon); pts.push({ m, az: p.az, alt: p.alt }) }
  const cross = (level, up) => {
    for (let i = 1; i < pts.length; i++) {
      const a = pts[i - 1], b = pts[i];
      if (up ? (a.alt < level && b.alt >= level) : (a.alt >= level && b.alt < level)) {
        const f = (level - a.alt) / (b.alt - a.alt), m = a.m + f * (b.m - a.m);
        return { m, az: sunPos(tpeMs(date, m), lat, lon).az };
      }
    }
    return null;
  };
  const noon = pts.reduce((x, y) => y.alt > x.alt ? y : x);
  const d = { pts, rise: cross(-0.833, true), set: cross(-0.833, false), noon,
    goldAM: [cross(-4, true), cross(6, true)], goldPM: [cross(6, false), cross(-4, false)],
    blueAM: [cross(-6, true), cross(-4, true)], bluePM: [cross(-4, false), cross(-6, false)] };
  dayCache.set(key, d);
  return d;
}
// 選中的日期和時間（指南針頁、相機共用）
function sunSelDefault() { const sd = (project && project.sunDates) || []; return { date: sd.length ? sd[0].date : todayTPE(), min: 390 } }
function sunSel() { let s = null; try { s = JSON.parse(lsGet("scout-sun-" + (project && project.id)) || "null") } catch (e) {} return s && /^\d{4}-\d\d-\d\d$/.test(s.date) ? s : sunSelDefault() }
function setSunSel(s) { lsSet("scout-sun-" + project.id, JSON.stringify(s)) }

let lastFix = null;   // 最近一次 GPS
function here() { return lastFix || (project && project.location) || null }
function sunMarks(now) {
  const out = (project.sun || []).map(s => ({ label: s.label, az: Number(s.az) })).filter(s => isFinite(s.az));
  const h = here();
  if (h) { const p = sunPos(now || Date.now(), h.lat, h.lon); if (p.alt > -3) out.unshift({ label: "現在的太陽", az: p.az, now: true, alt: p.alt }) }
  return out;
}

/* ================= 專案檔 ================= */
function normalizeProject(p) {
  if (!p || typeof p !== "object") throw new Error("不是專案檔");
  if (!p.id || typeof p.id !== "string") throw new Error("缺少 id");
  if (!Array.isArray(p.stations) || !p.stations.length) throw new Error("沒有任何站點");
  const seen = new Set();
  const stations = p.stations.map((s, i) => {
    if (!s.id) throw new Error("第 " + (i + 1) + " 站缺少 id");
    if (seen.has("s:" + s.id)) throw new Error("站點 id 重複：" + s.id);
    seen.add("s:" + s.id);
    const items = (s.items || []).map(it => {
      const o = Array.isArray(it) ? { id: it[0], text: it[1], hint: it[2], must: it[3] } : it;
      if (!o.id || !o.text) throw new Error(s.id + " 有題目缺少 id 或內容");
      if (seen.has("i:" + o.id)) throw new Error("題目 id 重複：" + o.id);
      seen.add("i:" + o.id);
      return { id: String(o.id), text: String(o.text), hint: o.hint ? String(o.hint) : "", must: !!o.must };
    });
    const start = s.start ? Date.parse(s.start) : NaN;
    return { id: String(s.id), short: String(s.short || s.title || s.id), title: String(s.title || s.short || s.id), scout: s.scout || "", shoot: s.shoot || "", note: s.note || "", start: isNaN(start) ? null : start, items };
  });
  const loc = p.location && isFinite(p.location.lat) && isFinite(p.location.lon) ? { lat: +p.location.lat, lon: +p.location.lon } : null;
  return { schema: 1, id: p.id, code: p.code || "", name: String(p.name || p.id), subtitle: p.subtitle || "", facts: Array.isArray(p.facts) ? p.facts.map(String) : [], guide: Array.isArray(p.guide) ? p.guide.map(String) : [],
    location: loc, declination: isFinite(p.declination) ? +p.declination : 0, sun: Array.isArray(p.sun) ? p.sun : [],
    sunDates: Array.isArray(p.sunDates) ? p.sunDates.filter(x => x && /^\d{4}-\d\d-\d\d$/.test(x.date)).map(x => ({ date: x.date, label: String(x.label || x.date) })) : [], stations, importedAt: Date.now() };
}
async function importProjectText(text) {
  let p;
  try { p = normalizeProject(JSON.parse(text)) } catch (e) { toast("匯入失敗：" + e.message, 4000); return }
  try {
    await flushLog();
    const existed = projects.some(x => x.id === p.id);
    await dbPut("projects", p);
    if (!(await dbGet("logs", p.id))) await dbPut("logs", emptyLog(p.id));
    try { if (navigator.storage && navigator.storage.persist) await navigator.storage.persist() } catch (e) {}
    lsSet("scout-current", p.id);
    await loadAll();
    toast(existed ? "專案已更新，原本的紀錄都還在" : "已匯入「" + p.name + "」");
  } catch (e) { toast("匯入失敗：" + (e && e.message || e), 4000) }
}

/* ================= 載入 ================= */
async function loadAll() {
  projects = (await dbAll("projects")).sort((a, b) => b.importedAt - a.importedAt);
  if (!projects.length) { showWelcome(); return }
  const cur = lsGet("scout-current");
  project = projects.find(p => p.id === cur) || projects[0];
  lsSet("scout-current", project.id);
  log = Object.assign(emptyLog(project.id), (await dbGet("logs", project.id)) || {});
  // App 被關掉時還在定位的，改成「沒抓到位置」
  for (const v of Object.values(log.visits)) for (const k of ["arrive", "leave"]) if (v[k] && v[k].gpsPending) delete v[k].gpsPending;
  for (const u of thumbURLs.values()) URL.revokeObjectURL(u);
  thumbURLs.clear();
  media = (await dbByIndex("photos", "project", project.id)).sort((a, b) => a.t - b.t);
  $("welcome").hidden = true; $("app").hidden = false;
  const u = readUI();
  idx = Math.min(Math.max(0, Number(u.idx) || 0), project.stations.length - 1);
  const j = autoJumpTarget(Date.now(), true);
  if (j >= 0) { idx = j; u.idx = j; writeUI(u); setTimeout(() => toast("依時間跳到：" + project.stations[j].short), 300) }
  renderAll();
}
function showWelcome() { $("app").hidden = true; $("welcome").hidden = false; $("w-ver").textContent = "版本 " + APP_VERSION }

/* ---- 依時間自動跳站：只在時間表剛換站的那一次、只往後跳、人還在這站或正在操作就不跳 ---- */
function scheduledIndex(now) {
  const timed = project.stations.map((s, i) => [s.start, i]).filter(x => x[0]);
  if (!timed.length) return -1;
  const last = Math.max(...timed.map(x => x[0]));
  if (now < timed[0][0] || now > last + 6 * 3600e3) return -1;
  let pick = -1;
  for (const [t, i] of timed) if (t <= now) pick = i;
  return pick;
}
function busy() {
  if (camOpen || rec || document.querySelector("dialog[open]")) return true;
  const a = document.activeElement;
  if (a && (a.tagName === "TEXTAREA" || a.tagName === "INPUT")) return true;
  const add = $("main").querySelector(".add-row input");
  return !!(add && add.value.trim());
}
function autoJumpTarget(now, atLaunch) {
  const s = scheduledIndex(now);
  if (s < 0) return -1;
  const u = readUI();
  if (u.schedSeen === s) return -1;                 // 這個時段已經處理過
  u.schedSeen = s; writeUI(u);
  const cur = project.stations[idx];
  if (cur.start && s <= idx) return -1;             // 不往回跳（出發前、問分署這種頁例外）
  const v = log.visits[cur.id] || {};
  if (v.arrive && !v.leave) return -1;              // 人還在這站
  if (!atLaunch && (busy() || now - lastActivity < 10 * 60e3)) return -1;
  return s;
}
function goTo(i) {
  flushLog();
  idx = Math.min(Math.max(0, i), project.stations.length - 1);
  const u = readUI(); u.idx = idx; writeUI(u);
  openNotes = {};
  renderAll();
  window.scrollTo(0, 0);
}

/* ================= 畫面 ================= */
const station = () => project.stations[idx];
function itemsOf(s) { return s.items.concat((log.custom[s.id] || []).map(c => ({ id: c.id, text: c.text, hint: "", must: false, custom: true }))) }
function isDone(id) { return !!(log.items[id] && log.items[id].done) }
function mustLeft(s) { return s.items.filter(i => i.must && !isDone(i.id)).length }
function renderAll() { renderTop(); renderStation(); renderFoot() }

function renderTop() {
  $("proj").replaceChildren(project.code ? el("small", { text: project.code }) : "", project.name);
  const chips = $("chips"); chips.replaceChildren();
  project.stations.forEach((s, i) => {
    const v = log.visits[s.id] || {};
    const dot = el("span", { class: "dot" + (mustLeft(s) === 0 ? " full" : v.arrive && !v.leave ? " here" : "") });
    chips.append(el("button", { class: "chip", type: "button", "aria-current": i === idx ? "true" : "false", onclick: () => goTo(i) }, dot, s.short));
  });
  const cur = chips.children[idx];
  if (cur) requestAnimationFrame(() => cur.scrollIntoView({ inline: "center", block: "nearest" }));
  $("menu-badge").hidden = !needBackup();
}
function renderFoot() {
  const st = project.stations;
  $("b-prev").disabled = idx === 0;
  const nb = $("b-next");
  nb.textContent = idx < st.length - 1 ? "下一站 " + st[idx + 1].short + " →" : "最後一站";
  nb.disabled = idx >= st.length - 1;
  $("b-rec").classList.toggle("on", !!rec);
  $("b-rec").textContent = rec ? "■" : "🎙";
}
function renderStation() {
  const s = station(), m = $("main"); m.replaceChildren();
  m.append(el("h1", { text: s.title }));
  const w = el("div", { class: "when" });
  if (s.scout) w.append(el("div", {}, el("b", { text: "場勘" }), s.scout));
  if (s.shoot) w.append(el("div", {}, el("b", { text: "正式" }), s.shoot));
  if (w.children.length) m.append(w);
  if (s.note) m.append(el("p", { class: "note-box", text: s.note }));

  const all = itemsOf(s), must = all.filter(i => i.must), rest = all.filter(i => !i.must);
  if (must.length) m.append(el("div", { class: "card" }, must.map(renderItem)));
  if (rest.length) {
    const d = el("details", { class: "more" }, el("summary", { text: (must.length ? "有空再看" : "題目") + "（" + rest.filter(i => !isDone(i.id)).length + "／" + rest.length + "）" }), el("div", { class: "card" }, rest.map(renderItem)));
    const u = readUI(); if ((u.openMore || {})[s.id] || !must.length) d.open = true;
    d.addEventListener("toggle", () => { const u2 = readUI(); u2.openMore = Object.assign(u2.openMore || {}, { [s.id]: d.open }); writeUI(u2) });

    el("h3", { text: "機身（感光元件）" }),
    opt(SENSORS.map(s => ({ v: s.id, t: s.name + "（" + s.note + "）" })), cp.sensor, "", v => { cp.sensor = v; saveCam(); renderCamControls(); applyZoom() }),
    el("h3", { text: "畫幅" }),
    opt(ASPECTS.map(a => ({ v: a.id, t: a.name })), cp.aspect, "", v => { cp.aspect = v; saveCam(); renderCamControls(); applyZoom() }),
    el("h3", { text: "手機鏡頭" }),
    cams.length > 1 ? opt([{ v: "", t: "自動" }].concat(cams.map((c, i) => ({ v: c.deviceId, t: c.label || "鏡頭 " + (i + 1) }))), cp.deviceId, "", async v => { cp.deviceId = v; saveCam(); await restartStream() }) : el("div", { class: "note", text: "只找到一顆鏡頭" },),
    el("div", { class: "note", text: "手機鏡頭等效焦段（自動判斷：" + ((cam && cam.baseGuess) || 26) + "mm）" }),
    opt([{ v: 0, t: "自動" }].concat(BASES.map(b => ({ v: b, t: b + "mm" }))), cp.base, "", v => { cp.base = v; saveCam(); applyZoom() }),
    calibLab, calib,
    el("div", { class: "note", text: "要更準：在同一個位置用真的攝影機拍一張，調「畫面寬度校正」讓框的左右邊跟攝影機畫面對齊。超廣角（14–20mm）要選手機的超廣角鏡頭才框得到。" }),
    el("button", { class: "cam-pill", type: "button", text: "關閉設定", onclick: () => { box.hidden = true } }));
  box.hidden = false;
}
async function restartStream() {
  if (!cam) return;
  if (cam.stream) cam.stream.getTracks().forEach(t => t.stop());
  cam.zoom = 1; cam.geom = null;
  const msg = $("cam-msg"); msg.hidden = false; msg.textContent = "切換鏡頭中…";
  try {
    const stream = await startStream();
    if (!camOpen) { stream.getTracks().forEach(t => t.stop()); return }
    cam.stream = stream; cam.track = stream.getVideoTracks()[0]; cam.baseGuess = guessBase(cam.track.label);
    const v = $("cam-video"); v.srcObject = stream; await v.play().catch(() => {});
    await new Promise(r => { if (v.videoWidth) r(); else v.addEventListener("loadedmetadata", r, { once: true }); setTimeout(r, 3000) });
    msg.hidden = true; await applyZoom();
  } catch (e) { msg.textContent = "開不了這顆鏡頭（" + (e && e.name || e) + "）" }
}

/* ================= 事件 ================= */
$("b-menu").addEventListener("click", openMenu);
$("b-compass").addEventListener("click", openCompass);
$("b-prev").addEventListener("click", () => goTo(idx - 1));
$("b-next").addEventListener("click", () => goTo(idx + 1));
$("b-cam").addEventListener("click", () => openCamera({ sid: station().id, itemId: null }));
$("b-rec").addEventListener("click", () => toggleRec({ sid: station().id, itemId: null }));
$("rec-stop").addEventListener("click", () => stopRec());
$("uns-retry").addEventListener("click", retryUnsaved);
$("uns-share").addEventListener("click", shareUnsaved);
$("cam-done").addEventListener("click", closeCamera);
$("cam-shutter").addEventListener("click", shoot);
$("cam-sys").addEventListener("click", () => { const t = cam && cam.target; if (t) systemCamera(t) });
$("cam-fmt").addEventListener("click", openCamSettings);
$("cam-setbtn").addEventListener("click", openCamSettings);
$("cam-calib").addEventListener("click", () => sunCalibrate("把太陽放在框的正中間（九宮格中心），拿法跟拍照時一樣。"));
$("cam-video").addEventListener("resize", () => { if (camOpen) applyZoom() });   // 轉向後影像長寬對調，重算框和變焦
$("w-import").addEventListener("click", () => $("f-import").click());
$("w-paste-go").addEventListener("click", () => importProjectText($("w-paste").value));
$("f-import").addEventListener("change", async () => {
  const f = $("f-import").files[0]; if (!f) return;
  try { await importProjectText(await f.text()) } finally { $("f-import").value = "" }
});
for (const d of ["menu", "viewer", "compass", "export"]) $(d).addEventListener("click", e => { if (e.target === $(d)) $(d).close() });
$("compass").addEventListener("close", () => clearInterval(compassTimer));
window.addEventListener("resize", () => { if (camOpen) setTimeout(layoutCam, 120) });
document.addEventListener("pointerdown", () => { lastActivity = Date.now() }, { capture: true });
document.addEventListener("input", () => { lastActivity = Date.now() }, { capture: true });
document.addEventListener("visibilitychange", async () => {
  if (document.visibilityState === "hidden") {
    flushLog();
    if (rec) { recCutByHide = true; stopRec() }   // iPhone 切到背景會停麥克風：先把錄到的存起來
    return;
  }
  if (recCutByHide) { recCutByHide = false; setTimeout(() => toast("剛剛螢幕關掉／切出去，錄音已停止並存好；要繼續請再按 🎙", 4500), 600) }
  if (!project) return;
  try { await dbGet("projects", project.id) } catch (e) {}   // 回來時先測一下資料庫連線（斷了會自動重連）
  if (dirty) flushLog();
  if (camOpen && cam && cam.track && cam.track.readyState === "ended") restartStream();
  const j = autoJumpTarget(Date.now(), false);
  if (j >= 0) { goTo(j); toast("依時間跳到：" + project.stations[j].short) }
});
window.addEventListener("pagehide", () => { flushLog(); if (rec) stopRec() });
// iOS 每次開 App 都要在點擊裡重新要一次指南針（同意過就不會再跳視窗）
document.addEventListener("click", () => { if (compassWanted && !compassOn) enableCompass(true) }, { capture: true });

(async function start() {
  compassWanted = lsGet("scout-compass") === "1";
  if (lsGet("scout-night") === "1") document.documentElement.classList.add("night");
  try { idb = await openDB(); await loadAll() }
  catch (e) { document.body.replaceChildren(el("div", { class: "welcome" }, el("h1", { text: "場勘" }), el("p", { text: "打不開手機裡的資料（" + (e && e.message || e) + "）。請用 Safari 打開、不要用無痕模式；還是不行就把 App 關掉重開。" }))); return }
  if ("serviceWorker" in navigator && location.protocol !== "file:") navigator.serviceWorker.register("sw.js").catch(() => {});
})();
</script>
